---
- name: Install Docker
  ansible.builtin.dnf:
    name: docker
    state: present

- name: Create CLI plugins directory
  ansible.builtin.file:
    path: /usr/libexec/docker/cli-plugins
    state: directory
    mode: "0755"

- name: Install Docker Compose v2 binary
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64"
    dest: /usr/libexec/docker/cli-plugins/docker-compose
    mode: "0755"

- name: Enable and start Docker daemon
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add appuser to docker group
  ansible.builtin.user:
    name: appuser
    groups: docker
    append: true

- name: Configure Docker daemon (log rotation + security)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "50m",
          "max-file": "3"
        },
        "no-new-privileges": true,
        "live-restore": true,
        "userland-proxy": false
      }
    mode: "0644"
  notify: restart docker
