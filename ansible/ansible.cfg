[defaults]
inventory          = inventory/aws_ssm.yml
remote_user        = ec2-user
host_key_checking  = False
retry_files_enabled = False
stdout_callback    = yaml
gathering          = smart
fact_caching       = memory

# SSM connection plugin — no SSH port needed
[ssh_connection]
pipelining = True

[inventory]
enable_plugins = aws_ec2
