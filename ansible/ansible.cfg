[defaults]
inventory          = inventory/inventory.aws_ec2.yml
remote_user        = ec2-user
host_key_checking  = False
retry_files_enabled = False
stdout_callback    = default
result_format      = yaml
gathering          = smart
fact_caching       = memory

# SSM connection plugin — no SSH port needed
[ssh_connection]
pipelining = True

[inventory]
enable_plugins = amazon.aws.aws_ec2
