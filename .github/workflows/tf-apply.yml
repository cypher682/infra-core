name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.7.0"
  AWS_REGION: "us-east-1"
  ENVIRONMENT: "dev"

jobs:
  terraform-apply:
    name: Apply (${{ env.ENVIRONMENT }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: environments/${{ env.ENVIRONMENT }}
        run: terraform init

      - name: Terraform Apply
        working-directory: environments/${{ env.ENVIRONMENT }}
        run: |
          terraform apply \
            -auto-approve \
            -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="db_username=${{ secrets.DB_USERNAME }}"
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Get ALB DNS name
        id: alb
        working-directory: environments/${{ env.ENVIRONMENT }}
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name)
          echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT

      - name: Smoke test — health check
        run: |
          echo "Waiting 60s for EC2 instances to register with ALB..."
          sleep 60
          
          ALB_URL="http://${{ steps.alb.outputs.alb_dns }}/health"
          echo "Testing: $ALB_URL"
          
          for i in {1..5}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ALB_URL")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✓ Health check passed (HTTP $HTTP_STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_STATUS — retrying in 15s..."
            sleep 15
          done
          
          echo "✗ Health check failed after 5 attempts"
          exit 1
