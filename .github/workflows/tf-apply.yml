name: Terraform Apply & App Deploy

on:
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
      - "ansible/**"
      - "app/**"
      - ".github/workflows/tf-*.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.7.0"
  AWS_REGION: "us-east-1"
  ENVIRONMENT: "dev"

jobs:
  build-and-deploy:
    name: Build, Apply & Deploy (${{ env.ENVIRONMENT }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to ECR (if app Dockerfile exists)
        if: hashFiles('app/Dockerfile') != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: infra-core-dev-app-repo
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: environments/${{ env.ENVIRONMENT }}
        run: terraform init

      - name: Terraform Apply (Idempotent)
        working-directory: environments/${{ env.ENVIRONMENT }}
        run: |
          terraform apply \
            -auto-approve \
            -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}"

      - name: Get ALB DNS name
        id: alb
        working-directory: environments/${{ env.ENVIRONMENT }}
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name)
          echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT

      - name: Install Ansible & AWS SSM dependencies
        run: |
          pip install ansible
          ansible-galaxy collection install amazon.aws community.general

      - name: Run Ansible Playbook via SSM
        run: |
          mkdir -p ~/.ansible
          cp ansible/ansible.cfg ~/.ansible.cfg
          cd ansible
          ansible-playbook site.yml \
            -i inventory/inventory.aws_ec2.yml \
            --extra-vars "env=${{ env.ENVIRONMENT }} aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" \
            -v
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Smoke test — ALB Health Check
        run: |
          echo "Waiting 30s for ALB health check evaluation..."
          sleep 30
          
          ALB_URL="http://${{ steps.alb.outputs.alb_dns }}/health"
          echo "Testing: $ALB_URL"
          
          for i in {1..5}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ALB_URL")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✓ Health check passed (HTTP $HTTP_STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_STATUS — retrying in 15s..."
            sleep 15
          done
          
          echo "✗ Health check failed after 5 attempts"
          exit 1
