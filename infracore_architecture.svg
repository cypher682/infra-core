<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="'Segoe UI', Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="vpcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1f3a"/>
      <stop offset="100%" style="stop-color:#182d52"/>
    </linearGradient>
    <linearGradient id="albGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a1f00"/>
      <stop offset="100%" style="stop-color:#6b3a00"/>
    </linearGradient>
    <linearGradient id="ec2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2a4a"/>
      <stop offset="100%" style="stop-color:#1a3f6f"/>
    </linearGradient>
    <linearGradient id="rdsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0f3a"/>
      <stop offset="100%" style="stop-color:#2d1a6f"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4f9eff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f87171"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="860" fill="url(#bg)"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff07" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="860" fill="url(#grid)"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="1200" height="70" fill="#161b22" opacity="0.95"/>
  <rect x="0" y="68" width="1200" height="2" fill="#f59e0b" opacity="0.7"/>

  <!-- Logo -->
  <rect x="36" y="16" width="38" height="38" rx="8" fill="#f59e0b" opacity="0.9"/>
  <text x="55" y="40" text-anchor="middle" font-size="16" fill="#0d1117" font-weight="800">IC</text>

  <text x="88" y="34" font-size="22" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">infra-core</text>
  <text x="88" y="55" font-size="12" fill="#f59e0b">AWS · Terraform 1.7 · Ansible · Multi-Environment IaC · CIS Hardened · CloudWatch · GuardDuty</text>

  <!-- Env badges -->
  <rect x="960" y="18" width="100" height="22" rx="11" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="1010" y="33" text-anchor="middle" font-size="10" fill="#34d399">dev  10.0.0.0/16</text>
  <rect x="1072" y="18" width="112" height="22" rx="11" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
  <text x="1128" y="33" text-anchor="middle" font-size="10" fill="#60a5fa">staging  10.1.0.0/16</text>

  <!-- ─────────────────────────── INTERNET ─────────────────────────────── -->
  <rect x="490" y="100" width="220" height="60" rx="12" fill="#161b22" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="125" text-anchor="middle" font-size="20">🌐</text>
  <text x="600" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">Internet</text>

  <!-- ─────────────────────────── VPC BOUNDARY ─────────────────────────── -->
  <rect x="60" y="200" width="820" height="520" rx="16" fill="url(#vpcGrad)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="8,4" filter="url(#shadow)"/>
  <text x="80" y="222" font-size="11" fill="#60a5fa">AWS VPC  —  Multi-AZ  (us-east-1)</text>

  <!-- Public subnets label -->
  <rect x="80" y="232" width="760" height="18" rx="4" fill="#3b82f6" opacity="0.08"/>
  <text x="460" y="244" text-anchor="middle" font-size="10" fill="#60a5fa">Public Subnets — us-east-1a &amp; us-east-1b</text>

  <!-- ALB -->
  <rect x="310" y="258" width="380" height="80" rx="12" fill="url(#albGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="280" font-size="10" fill="#94a3b8">LOAD BALANCER</text>
  <text x="500" y="297" text-anchor="middle" font-size="20">⚖️</text>
  <text x="500" y="316" text-anchor="middle" font-size="15" font-weight="700" fill="#fbbf24">Application Load Balancer (ALB)</text>
  <text x="500" y="330" text-anchor="middle" font-size="10" fill="#94a3b8">HTTP :80 · Target Group · Health checks · 2 AZs</text>

  <!-- Private subnets label -->
  <rect x="80" y="360" width="760" height="18" rx="4" fill="#6b7280" opacity="0.08"/>
  <text x="460" y="372" text-anchor="middle" font-size="10" fill="#9ca3af">Private Subnets — us-east-1a &amp; us-east-1b</text>

  <!-- EC2 ASG -->
  <rect x="200" y="388" width="560" height="140" rx="12" fill="url(#ec2Grad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="220" y="410" font-size="10" fill="#94a3b8">COMPUTE</text>
  <text x="480" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#93c5fd">EC2 Auto Scaling Group</text>
  <text x="480" y="440" text-anchor="middle" font-size="10" fill="#94a3b8">t3.micro · Launch Template · CPU-based scaling policies</text>

  <!-- EC2 instance boxes -->
  <rect x="220" y="450" width="230" height="64" rx="8" fill="#0f2040" stroke="#3b82f6" stroke-width="1" opacity="0.9"/>
  <text x="335" y="470" text-anchor="middle" font-size="12" fill="#bfdbfe">EC2 (us-east-1a)</text>
  <text x="335" y="487" text-anchor="middle" font-size="9" fill="#94a3b8">Nginx · Docker · App Container</text>
  <text x="335" y="503" text-anchor="middle" font-size="9" fill="#60a5fa">CIS AL2023 · fail2ban · auditd</text>

  <rect x="510" y="450" width="230" height="64" rx="8" fill="#0f2040" stroke="#3b82f6" stroke-width="1" opacity="0.9"/>
  <text x="625" y="470" text-anchor="middle" font-size="12" fill="#bfdbfe">EC2 (us-east-1b)</text>
  <text x="625" y="487" text-anchor="middle" font-size="9" fill="#94a3b8">Nginx · Docker · App Container</text>
  <text x="625" y="503" text-anchor="middle" font-size="9" fill="#60a5fa">CIS AL2023 · fail2ban · auditd</text>

  <!-- RDS -->
  <rect x="270" y="570" width="420" height="120" rx="12" fill="url(#rdsGrad)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="290" y="592" font-size="10" fill="#94a3b8">DATABASE</text>
  <text x="480" y="606" text-anchor="middle" font-size="15" font-weight="700" fill="#c084fc">RDS PostgreSQL 15</text>
  <text x="480" y="622" text-anchor="middle" font-size="10" fill="#94a3b8">db.t3.micro · Multi-AZ subnet group · No public access</text>
  <text x="480" y="638" text-anchor="middle" font-size="10" fill="#94a3b8">AES-256 encryption at rest · Parameter group hardening</text>
  <text x="480" y="660" text-anchor="middle" font-size="9" fill="#8b5cf6">Port :5432  ·  publicly_accessible = false  ·  Private SG only</text>
  <text x="480" y="680" text-anchor="middle" font-size="9" fill="#94a3b8">Credentials from SSM Parameter Store (KMS SecureString)</text>

  <!-- ─────────────────────────── RIGHT PANEL - AWS SERVICES ─────────────────────────── -->

  <!-- Panel background -->
  <rect x="910" y="100" width="270" height="660" rx="14" fill="#13181f" stroke="#374151" stroke-width="1" filter="url(#shadow)"/>
  <rect x="910" y="100" width="270" height="30" rx="14" fill="#1f2937" opacity="0.8"/>
  <text x="1045" y="120" text-anchor="middle" font-size="11" fill="#9ca3af" font-weight="600">AWS SERVICES</text>

  <!-- GitHub Actions OIDC -->
  <rect x="926" y="142" width="238" height="70" rx="8" fill="#161b22" stroke="#10b981" stroke-width="1.2"/>
  <text x="936" y="161" font-size="9" fill="#94a3b8">CI / CD  —  NO STATIC KEYS</text>
  <text x="1045" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#6ee7b7">GitHub Actions OIDC</text>
  <text x="1045" y="194" text-anchor="middle" font-size="9" fill="#94a3b8">tf-plan on PR · tf-apply on merge</text>
  <text x="1045" y="206" text-anchor="middle" font-size="9" fill="#10b981">Checkov IaC scan blocks merge</text>

  <!-- SSM Session Manager -->
  <rect x="926" y="226" width="238" height="65" rx="8" fill="#161b22" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="936" y="244" font-size="9" fill="#94a3b8">ZERO-TRUST ACCESS</text>
  <text x="1045" y="261" text-anchor="middle" font-size="13" font-weight="700" fill="#fbbf24">SSM Session Manager</text>
  <text x="1045" y="277" text-anchor="middle" font-size="9" fill="#94a3b8">No SSH port · No bastion host</text>
  <text x="1045" y="289" text-anchor="middle" font-size="9" fill="#f59e0b">No key pairs  ·  IAM-controlled access</text>

  <!-- SSM Parameter Store -->
  <rect x="926" y="305" width="238" height="65" rx="8" fill="#161b22" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="936" y="323" font-size="9" fill="#94a3b8">SECRETS MANAGEMENT</text>
  <text x="1045" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#fbbf24">SSM Parameter Store</text>
  <text x="1045" y="356" text-anchor="middle" font-size="9" fill="#94a3b8">SecureString + KMS encryption</text>
  <text x="1045" y="368" text-anchor="middle" font-size="9" fill="#f59e0b">$0/secret vs Secrets Manager $0.40</text>

  <!-- ECR -->
  <rect x="926" y="384" width="238" height="60" rx="8" fill="#161b22" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="936" y="402" font-size="9" fill="#94a3b8">CONTAINER REGISTRY</text>
  <text x="1045" y="419" text-anchor="middle" font-size="13" font-weight="700" fill="#fbbf24">Amazon ECR</text>
  <text x="1045" y="435" text-anchor="middle" font-size="9" fill="#94a3b8">Docker images · Ansible pulls via app-deploy role</text>

  <!-- S3 -->
  <rect x="926" y="458" width="238" height="60" rx="8" fill="#161b22" stroke="#10b981" stroke-width="1.2"/>
  <text x="936" y="476" font-size="9" fill="#94a3b8">OBJECT STORAGE</text>
  <text x="1045" y="493" text-anchor="middle" font-size="13" font-weight="700" fill="#6ee7b7">Amazon S3</text>
  <text x="1045" y="509" text-anchor="middle" font-size="9" fill="#94a3b8">VPC flow logs + app assets · 30-day retention</text>

  <!-- CloudWatch -->
  <rect x="926" y="532" width="238" height="65" rx="8" fill="#161b22" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="936" y="550" font-size="9" fill="#94a3b8">OBSERVABILITY</text>
  <text x="1045" y="567" text-anchor="middle" font-size="13" font-weight="700" fill="#fbbf24">Amazon CloudWatch</text>
  <text x="1045" y="583" text-anchor="middle" font-size="9" fill="#94a3b8">Metrics · Log groups · Alarms</text>
  <text x="1045" y="595" text-anchor="middle" font-size="9" fill="#f59e0b">SNS email alerts · Dashboard</text>

  <!-- Security trio -->
  <rect x="926" y="611" width="238" height="130" rx="8" fill="#161b22" stroke="#ef4444" stroke-width="1.2"/>
  <text x="936" y="629" font-size="9" fill="#94a3b8">SECURITY &amp; COMPLIANCE</text>

  <rect x="934" y="636" width="70" height="48" rx="6" fill="#2d0f0f" stroke="#ef4444" stroke-width="1"/>
  <text x="969" y="656" text-anchor="middle" font-size="11" font-weight="600" fill="#fca5a5">GuardDuty</text>
  <text x="969" y="671" text-anchor="middle" font-size="8" fill="#94a3b8">Threat</text>
  <text x="969" y="681" text-anchor="middle" font-size="8" fill="#94a3b8">detection</text>

  <rect x="1013" y="636" width="70" height="48" rx="6" fill="#1a0f2e" stroke="#8b5cf6" stroke-width="1"/>
  <text x="1048" y="656" text-anchor="middle" font-size="11" font-weight="600" fill="#c084fc">Sec Hub</text>
  <text x="1048" y="671" text-anchor="middle" font-size="8" fill="#94a3b8">CIS bench-</text>
  <text x="1048" y="681" text-anchor="middle" font-size="8" fill="#94a3b8">mark</text>

  <rect x="1092" y="636" width="64" height="48" rx="6" fill="#1a1a0f" stroke="#eab308" stroke-width="1"/>
  <text x="1124" y="656" text-anchor="middle" font-size="11" font-weight="600" fill="#fde047">Config</text>
  <text x="1124" y="671" text-anchor="middle" font-size="8" fill="#94a3b8">Compliance</text>
  <text x="1124" y="681" text-anchor="middle" font-size="8" fill="#94a3b8">rules</text>

  <text x="1045" y="706" text-anchor="middle" font-size="8.5" fill="#94a3b8">IMDSv2 · EBS encrypted · No public RDS</text>
  <text x="1045" y="719" text-anchor="middle" font-size="8.5" fill="#ef4444">Least-privilege IAM · No AdministratorAccess</text>
  <text x="1045" y="732" text-anchor="middle" font-size="8.5" fill="#94a3b8">VPC flow logs ALL traffic → S3</text>

  <!-- NAT Gateway note -->
  <rect x="80" y="735" width="240" height="42" rx="8" fill="#1a1500" stroke="#eab308" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="200" y="752" text-anchor="middle" font-size="10" fill="#fde047">NAT Gateway</text>
  <text x="200" y="768" text-anchor="middle" font-size="9" fill="#94a3b8">Single NAT (dev/staging)  ·  $0.045/hr  ·  Egress → Internet</text>

  <!-- Terraform + Ansible badges -->
  <rect x="340" y="740" width="100" height="28" rx="6" fill="#3a0f6b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="390" y="759" text-anchor="middle" font-size="11" font-weight="600" fill="#c084fc">Terraform 1.7</text>

  <rect x="452" y="740" width="90" height="28" rx="6" fill="#3a0f0f" stroke="#ef4444" stroke-width="1"/>
  <text x="497" y="759" text-anchor="middle" font-size="11" font-weight="600" fill="#fca5a5">Ansible</text>

  <rect x="555" y="740" width="130" height="28" rx="6" fill="#0f2a1a" stroke="#10b981" stroke-width="1"/>
  <text x="620" y="759" text-anchor="middle" font-size="10" fill="#6ee7b7">make init/plan/apply</text>

  <!-- ─────────────────────────── ARROWS ─────────────────────────── -->

  <!-- Internet → ALB -->
  <line x1="600" y1="160" x2="600" y2="256" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <rect x="524" y="198" width="90" height="16" rx="4" fill="#0d1117" opacity="0.9"/>
  <text x="569" y="210" text-anchor="middle" font-size="9" fill="#f59e0b">HTTP :80</text>

  <!-- ALB → EC2 -->
  <line x1="500" y1="338" x2="480" y2="386" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="462" y="350" width="80" height="16" rx="4" fill="#0d1117" opacity="0.9"/>
  <text x="502" y="362" text-anchor="middle" font-size="9" fill="#3b82f6">target group</text>

  <!-- EC2 → RDS -->
  <line x1="480" y1="528" x2="480" y2="568" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <rect x="400" y="540" width="80" height="16" rx="4" fill="#0d1117" opacity="0.9"/>
  <text x="440" y="552" text-anchor="middle" font-size="9" fill="#8b5cf6">:5432 (private)</text>

  <!-- SSM → EC2 (dashed) -->
  <line x1="926" y1="258" x2="760" y2="490" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <rect x="810" y="354" width="100" height="16" rx="4" fill="#0d1117" opacity="0.9"/>
  <text x="860" y="366" text-anchor="middle" font-size="9" fill="#f59e0b">SSM tunnel</text>

  <!-- ECR → EC2 (dashed) -->
  <line x1="926" y1="414" x2="742" y2="480" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <rect x="796" y="436" width="90" height="16" rx="4" fill="#0d1117" opacity="0.9"/>
  <text x="841" y="448" text-anchor="middle" font-size="9" fill="#10b981">docker pull</text>

  <!-- EC2 → CloudWatch (dashed) -->
  <line x1="760" y1="480" x2="926" y2="565" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <rect x="800" y="510" width="80" height="16" rx="4" fill="#0d1117" opacity="0.9"/>
  <text x="840" y="522" text-anchor="middle" font-size="9" fill="#f59e0b">metrics/logs</text>

  <!-- GitHub → Terraform -->
  <line x1="926" y1="177" x2="880" y2="258" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>

  <!-- S3 ← VPC flow logs (from VPC boundary) -->
  <line x1="880" y1="630" x2="926" y2="488" stroke="#10b981" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>

  <!-- Footer -->
  <text x="600" y="840" text-anchor="middle" font-size="10" fill="#4b5563">Built by cypher682 · infra-core · Clouddevops Portfolio 2026 · Sprint cost ~$4–6 (provision → evidence → destroy)</text>
</svg>
